name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit || npx tsc --noEmit
      - name: Offline test tier (hero-path units + copy/banned-term gate)
        run: npm test
      - name: Hero public proof (zero-infra re-resolver)
        run: npm run proof:public
