<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="WhoPays split-flap seat mark">
  <!-- split-flap seat tile: the signature object. Amber authority line above the fold, green settlement bar below — a seat flipping from owing to paid. -->
  <rect x="8" y="8" width="84" height="84" rx="14" fill="#0e0e10" stroke="#2a2a30" stroke-width="4"/>
  <rect x="24" y="30" width="52" height="8" rx="2" fill="#f0a92e"/>
  <rect x="24" y="62" width="52" height="8" rx="2" fill="#57b06f"/>
  <line x1="8" y1="50" x2="92" y2="50" stroke="#000000" stroke-width="3" opacity="0.7"/>
  <line x1="8" y1="51.5" x2="92" y2="51.5" stroke="#ffffff" stroke-width="1" opacity="0.04"/>
</svg>
