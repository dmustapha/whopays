<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 108" role="img" aria-label="WhoPays">
  <title>WhoPays — the bill enforces itself</title>
  <!-- combination mark: split-flap seat tile + WHOPAYS wordmark in the Solari display voice -->
  <rect x="8" y="20" width="60" height="60" rx="10" fill="#0e0e10" stroke="#2a2a30" stroke-width="3"/>
  <rect x="19" y="35" width="38" height="6" rx="2" fill="#f0a92e"/>
  <rect x="19" y="59" width="38" height="6" rx="2" fill="#57b06f"/>
  <line x1="8" y1="50" x2="68" y2="50" stroke="#000000" stroke-width="2.5" opacity="0.7"/>
  <text x="90" y="62" font-family="'Archivo Narrow', 'Arial Narrow', sans-serif" font-weight="700" font-size="46" letter-spacing="4" fill="#f4f1ea" style="text-transform:uppercase">WHOPAYS</text>
  <!-- the line under it: owing (amber) settles to paid (green), split like a departure-board flap -->
  <line x1="92" y1="80" x2="228" y2="80" stroke="#f0a92e" stroke-width="4" stroke-linecap="round"/>
  <line x1="236" y1="80" x2="352" y2="80" stroke="#57b06f" stroke-width="4" stroke-linecap="round"/>
</svg>
